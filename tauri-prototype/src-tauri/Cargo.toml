[package]
name = "tauri-prototype"
version = "0.1.0"
description = "Korgo Pro — prototype React + Tauri"
authors = ["Korgo Pro"]
edition = "2021"

[profile.release]
opt-level = "s"

[dependencies]
# --- Tauri 2 ---
tauri = { version = "2", features = ["tracing"] }
tauri-plugin-opener = "2"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Utils ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Pour se connecter à Supabase en production, ajouter :
# tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
# tokio-postgres-rustls = "0.6"  (pour TLS avec rustls)

[dev-dependencies]
