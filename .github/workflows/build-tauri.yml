name: Build & Release Korgo Pro (Tauri)

# Déploiement automatique (Tauri) :
# - A chaque push sur "main"  -> compilation de l'app Tauri + upload en artefact
# - A chaque tag "v*" (ex: v1.0.0) -> compilation + création d'une GitHub Release
#   avec l'installateur NSIS, pret a telecharger.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows (Tauri)
    runs-on: windows-latest

    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Mettre en place Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tauri-prototype/web/package-lock.json

      - name: Mettre en place Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configurer l'environnement MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Installer les dependances frontend
        working-directory: tauri-prototype/web
        run: npm ci

      - name: Construire le frontend (Vite)
        working-directory: tauri-prototype/web
        run: npm run build

      - name: Construire l'application Tauri (installateur NSIS)
        shell: pwsh
        working-directory: tauri-prototype
        run: .\web\node_modules\.bin\tauri.cmd build

      - name: Verifier la presence de l'installateur
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "tauri-prototype/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "L'installateur Tauri NSIS est introuvable."
            exit 1
          }
          Write-Output "Installateur OK : $($installer.FullName)"
          Get-Item $installer.FullName | Select-Object FullName, Length

      # Version nb (vX.Y.Z) : creer une GitHub Release avec l'installateur.
      - name: Creer la GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Korgo Pro (Tauri) ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            tauri-prototype/src-tauri/target/release/bundle/nsis/*.exe

      # Sur chaque push de main (pas de tag) : conserver l'installateur comme
      # artefact telechargeable depuis l'onglet "Actions".
      - name: Uploader l'artefact de build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: KorgoPro-Tauri-build
          path: tauri-prototype/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error # Echec si l'installateur attendu est absent.
